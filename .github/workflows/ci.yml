name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lewe
          POSTGRES_PASSWORD: lewe
          POSTGRES_DB: lewe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lewe"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Lint
        run: make lint
      - name: Test
        env:
          TEST_DATABASE_URL: postgres://lewe:lewe@localhost:5432/lewe_test?sslmode=disable
        run: go test -race ./...

  webapp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Typecheck and build
        run: npm run build
