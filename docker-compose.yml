services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lewe
      POSTGRES_PASSWORD: lewe
      POSTGRES_DB: lewe
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lewe"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build: .
    environment:
      DATABASE_URL: postgres://lewe:lewe@db:5432/lewe?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-0123456789abcdef}
      PORT: ":8080"
      MATCH_INTERVAL: 30s
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
